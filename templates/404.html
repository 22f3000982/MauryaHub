{% extends "base.html" %}

{% block title %}Page not found · MauryaHub{% endblock %}

{% block content %}
<div class="page page-narrow" data-reveal-page>
    <div class="empty-state" style="padding-block: var(--sp-16);">
        <p class="text-soft font-bold" style="font-size: var(--fs-3xl); line-height: 1;">404</p>
        <h1 class="mt-4 mb-2">Page not found</h1>
        <p>The page you're looking for doesn't exist, or it may have been moved.</p>
        <div class="page-actions justify-center">
            <a class="btn btn-primary" href="{{ url_for('course_view') }}">Go to courses</a>
            <a class="btn btn-secondary" href="{{ url_for('general_resources_page') }}">Browse resources</a>
        </div>
    </div>
</div>
{% endblock %}
