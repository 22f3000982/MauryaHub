{% extends "base.html" %}

{% block title %}Add course · MauryaHub{% endblock %}

{% block content %}
<div class="page page-narrow" data-reveal-page>

    <nav class="breadcrumb">
        <a href="{{ url_for('course_view') }}">Courses</a>
        <span class="breadcrumb-sep">/</span>
        <span>Add course</span>
    </nav>

    <div class="page-header">
        <div>
            <h1 class="page-title">Add course</h1>
            <p class="page-subtitle">Create a new course in the catalog. You can add quizzes and resources to it afterwards.</p>
        </div>
    </div>

    <div class="card card-pad">
        <form method="post">
            <div class="form-group">
                <label class="form-label" for="course_name">Course name <span class="required">*</span></label>
                <input class="form-control" type="text" id="course_name" name="course_name"
                       placeholder="e.g. Business Analytics" required autofocus>
                <p class="form-hint">This is how the course appears on the dashboard.</p>
            </div>

            <div class="form-actions">
                <button class="btn btn-primary" type="submit">Add course</button>
                <a class="btn btn-ghost" href="{{ url_for('course_view') }}">Cancel</a>
            </div>
        </form>
    </div>

</div>
{% endblock %}
