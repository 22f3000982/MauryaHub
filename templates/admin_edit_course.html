{% extends "base.html" %}

{% block title %}Edit course · MauryaHub{% endblock %}

{% block content %}
<div class="page page-narrow" data-reveal-page>

    <nav class="breadcrumb">
        <a href="{{ url_for('course_view') }}">Courses</a>
        <span class="breadcrumb-sep">/</span>
        <a href="{{ url_for('course_detail', course_id=course_id) }}">{{ course_name }}</a>
        <span class="breadcrumb-sep">/</span>
        <span>Edit</span>
    </nav>

    <div class="page-header">
        <div>
            <h1 class="page-title">Edit course</h1>
            <p class="page-subtitle">Rename this course. Its quizzes and resources stay as they are.</p>
        </div>
    </div>

    <div class="card card-pad">
        <form method="post">
            <div class="form-group">
                <label class="form-label" for="course_name">Course name <span class="required">*</span></label>
                <input class="form-control" type="text" id="course_name" name="course_name"
                       value="{{ course_name }}" required autofocus>
            </div>

            <div class="form-actions">
                <button class="btn btn-primary" type="submit">Save changes</button>
                <a class="btn btn-ghost" href="{{ url_for('course_detail', course_id=course_id) }}">Cancel</a>
            </div>
        </form>
    </div>

</div>
{% endblock %}
