<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add General Resource</title>
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Space Grotesk', sans-serif;
            background:
                radial-gradient(circle at 8% 10%, rgba(56, 189, 248, 0.16), transparent 36rem),
                radial-gradient(circle at 90% 18%, rgba(96, 165, 250, 0.16), transparent 32rem),
                radial-gradient(circle at 70% 86%, rgba(34, 211, 238, 0.12), transparent 36rem),
                linear-gradient(180deg, #0f172a 0%, #0b1020 52%, #111827 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .panel {
            width: 100%;
            max-width: 560px;
            background: linear-gradient(180deg, rgba(26, 36, 58, 0.92), rgba(20, 28, 46, 0.72));
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 18px 40px rgba(2, 6, 23, 0.5);
            backdrop-filter: blur(12px);
        }

        h1 {
            margin: 0 0 8px;
            font-family: 'IBM Plex Serif', serif;
            font-size: 1.6rem;
            color: #e2e8f0;
        }

        p {
            margin: 0 0 16px;
            color: #9aa4b2;
            font-size: 0.92rem;
        }

        label {
            display: block;
            margin: 10px 0 6px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #cbd5e1;
        }

        input, select {
            width: 100%;
            padding: 10px 11px;
            border-radius: 10px;
            border: 1px solid rgba(148, 163, 184, 0.3);
            background: rgba(15, 23, 42, 0.65);
            color: #f8fafc;
        }

        input:focus, select:focus {
            outline: none;
            border-color: rgba(56, 189, 248, 0.6);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
        }

        .hint {
            margin-top: 10px;
            font-size: 0.82rem;
            color: #bae6fd;
            background: rgba(30, 41, 59, 0.55);
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 10px;
            padding: 8px 10px;
        }

        .title-preview {
            margin-top: 8px;
            font-size: 0.8rem;
            color: #cbd5e1;
            background: rgba(15, 23, 42, 0.5);
            border: 1px dashed rgba(148, 163, 184, 0.35);
            border-radius: 10px;
            padding: 8px 10px;
        }

        .title-preview span {
            display: block;
            margin-top: 4px;
            color: #f8fafc;
            font-weight: 700;
            word-break: break-word;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            border-radius: 10px;
            padding: 10px 16px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #38bdf8, #60a5fa);
            color: #0b1020;
            box-shadow: 0 10px 20px rgba(56, 189, 248, 0.28);
        }

        .btn-secondary {
            background: transparent;
            color: #e2e8f0;
            border: 1px solid rgba(148, 163, 184, 0.35);
        }
    </style>
</head>
<body>
    <div class="panel">
        <h1>Add General Resource</h1>
        <p>You can add either a direct URL (Drive/PDF link) or upload a PDF/HTML file.</p>

        <form method="post" enctype="multipart/form-data">
            <label for="title">Title</label>
            <input id="title" name="title" type="text" required>
            <div class="title-preview" id="title_preview">
                Final title preview (auto):
                <span id="title_preview_value">Start typing title to see preview...</span>
            </div>

            <label for="program_type">Program Type</label>
            <select id="program_type" name="program_type" required>
                <option value="">Select Type</option>
                <option value="diploma">Diploma</option>
                <option value="degree">Degree</option>
            </select>

            <label for="subject_id">Subject</label>
            <select id="subject_id" name="subject_id" required>
                <option value="">Select subject</option>
            </select>

            <label for="resource_link">Direct Link (optional if uploading a file)</label>
            <input id="resource_link" name="resource_link" type="text" placeholder="https://drive.google.com/... or direct PDF/HTML URL">

            <label for="tags">Tags (comma separated)</label>
            <input id="tags" name="tags" type="text" placeholder="mlf, statistics, week-1">

            <label for="resource_pdf">Upload PDF/HTML (optional if link provided)</label>
            <input id="resource_pdf" name="resource_pdf" type="file" accept=".pdf,application/pdf,.html,.htm,text/html">

            <div class="hint">At least one field is required: either direct link or PDF/HTML file.</div>

            <div class="actions">
                <button class="btn btn-primary" type="submit">Save Resource</button>
                <a class="btn btn-secondary" href="{{ url_for('general_resources_page') }}">Back to Resources</a>
            </div>
        </form>
    </div>

    <script>
        const subjectsByProgram = {{ subjects_by_program | tojson }};
        const programSelect = document.getElementById('program_type');
        const subjectSelect = document.getElementById('subject_id');
        const titleInput = document.getElementById('title');
        const titlePreviewValue = document.getElementById('title_preview_value');
        const submitForm = document.querySelector('form[method="post"]');
        const currentUsername = {{ (current_username or '') | tojson }};

        function escapeRegExp(value) {
            return value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function removeUsernameSuffix(rawTitle) {
            if (!rawTitle) return '';
            const trimmed = rawTitle.trim();
            if (!currentUsername) return trimmed;
            const suffixPattern = new RegExp(`\\s*\\(${escapeRegExp(currentUsername)}\\)$`, 'i');
            return trimmed.replace(suffixPattern, '').trim();
        }

        function buildFinalTitle(rawTitle) {
            const cleanTitle = removeUsernameSuffix(rawTitle);
            if (!cleanTitle) return '';
            if (!currentUsername) return cleanTitle;
            return `${cleanTitle} (${currentUsername})`;
        }

        function renderTitlePreview() {
            const finalTitle = buildFinalTitle(titleInput.value || '');
            if (finalTitle) {
                titlePreviewValue.textContent = finalTitle;
                return;
            }
            if (currentUsername) {
                titlePreviewValue.textContent = `Your title will end with (${currentUsername})`;
                return;
            }
            titlePreviewValue.textContent = 'Start typing title to see preview...';
        }

        function populateSubjects(program) {
            const list = subjectsByProgram[program] || [];
            let options = '<option value="">Select subject</option>';
            options += list.map(item => `<option value="${item.id}">${item.name}</option>`).join('');
            subjectSelect.innerHTML = options;
        }

        programSelect.addEventListener('change', () => {
            populateSubjects(programSelect.value);
        });

        titleInput.addEventListener('input', renderTitlePreview);
        submitForm.addEventListener('submit', () => {
            titleInput.value = buildFinalTitle(titleInput.value || '');
        });

        renderTitlePreview();
    </script>
</body>
</html>
