{% extends "base.html" %}
{% set show_ads = true %}

{% block title %}Server error · MauryaHub{% endblock %}

{% block content %}
<div class="page page-narrow" data-reveal-page>
    <div class="empty-state" style="padding-block: var(--sp-16);">
        <p class="text-soft font-bold" style="font-size: var(--fs-3xl); line-height: 1;">500</p>
        <h1 class="mt-4 mb-2">Something went wrong</h1>
        <p>An error occurred on our end. Please try again in a moment.</p>
        <div class="page-actions justify-center">
            <a class="btn btn-primary" href="{{ url_for('course_view') }}">Go to courses</a>
            <a class="btn btn-secondary" href="{{ url_for('contact_us') }}">Report a problem</a>
        </div>
    </div>
</div>
{% endblock %}
