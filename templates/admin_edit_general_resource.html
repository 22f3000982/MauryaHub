<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit General Resource</title>
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Space Grotesk', sans-serif;
            background:
                radial-gradient(circle at 8% 10%, rgba(56, 189, 248, 0.16), transparent 36rem),
                radial-gradient(circle at 90% 18%, rgba(96, 165, 250, 0.16), transparent 32rem),
                radial-gradient(circle at 70% 86%, rgba(34, 211, 238, 0.12), transparent 36rem),
                linear-gradient(180deg, #0f172a 0%, #0b1020 52%, #111827 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .panel {
            width: 100%;
            max-width: 560px;
            background: linear-gradient(180deg, rgba(26, 36, 58, 0.92), rgba(20, 28, 46, 0.72));
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 18px 40px rgba(2, 6, 23, 0.5);
            backdrop-filter: blur(12px);
        }

        h1 {
            margin: 0 0 8px;
            font-family: 'IBM Plex Serif', serif;
            font-size: 1.6rem;
            color: #e2e8f0;
        }

        p {
            margin: 0 0 16px;
            color: #9aa4b2;
            font-size: 0.92rem;
        }

        label {
            display: block;
            margin: 10px 0 6px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #cbd5e1;
        }

        input, select {
            width: 100%;
            padding: 10px 11px;
            border-radius: 10px;
            border: 1px solid rgba(148, 163, 184, 0.3);
            background: rgba(15, 23, 42, 0.65);
            color: #f8fafc;
        }

        input:focus, select:focus {
            outline: none;
            border-color: rgba(56, 189, 248, 0.6);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
        }

        .hint {
            margin-top: 10px;
            font-size: 0.82rem;
            color: #bae6fd;
            background: rgba(30, 41, 59, 0.55);
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 10px;
            padding: 8px 10px;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            border-radius: 10px;
            padding: 10px 16px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #38bdf8, #60a5fa);
            color: #0b1020;
            box-shadow: 0 10px 20px rgba(56, 189, 248, 0.28);
        }

        .btn-secondary {
            background: transparent;
            color: #e2e8f0;
            border: 1px solid rgba(148, 163, 184, 0.35);
        }
    </style>
</head>
<body>
    <div class="panel">
        <h1>Edit General Resource</h1>
        <p>Update the title, link, program, or replace the file.</p>

        <form method="post" enctype="multipart/form-data">
            <label for="title">Title</label>
            <input id="title" name="title" type="text" value="{{ resource.title }}" required>

            <label for="program_type">Program Type</label>
            <select id="program_type" name="program_type" required>
                <option value="diploma" {% if resource.program_type == 'diploma' %}selected{% endif %}>Diploma</option>
                <option value="degree" {% if resource.program_type == 'degree' %}selected{% endif %}>Degree</option>
            </select>

            <label for="resource_link">Direct Link (optional if uploading a file)</label>
            <input id="resource_link" name="resource_link" type="text" value="{{ resource.resource_link }}" placeholder="https://drive.google.com/... or direct PDF/HTML URL">

            <label for="tags">Tags (comma separated)</label>
            <input id="tags" name="tags" type="text" value="{{ resource.tags }}" placeholder="mlf, statistics, week-1">

            <label for="resource_pdf">Replace PDF/HTML (optional)</label>
            <input id="resource_pdf" name="resource_pdf" type="file" accept=".pdf,application/pdf,.html,.htm,text/html">

            <div class="hint">At least one field is required: either direct link or PDF/HTML file.</div>

            <div class="actions">
                <button class="btn btn-primary" type="submit">Save Changes</button>
                <a class="btn btn-secondary" href="{{ url_for('general_resources_page') }}">Back to Resources</a>
            </div>
        </form>
    </div>
</body>
</html>
